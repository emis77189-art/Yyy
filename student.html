['السلحفاة الواثقة','سلحفاةٌ اسمها {n} ظنّت أنها أبطأ من أن تتفوق. لكنها كانت تكتب واجبها كل يوم بتأنٍّ دون أن تتوقف. وفي يوم الاختبار الكبير فوجئ الجميع بأنها الأكثر استعدادًا وهدوءًا. قال لها المعلم: «المهم ليس أن تكون الأسرع، بل أن تكون المستمر». أغمضت {n} عينيها مبتسمة، فقد عرفت سرّ النجاح. تصبح على خير يا {n}.'],

['العصفور الشجاع','عصفورٌ صغير اسمه {n} خاف من قراءة درسٍ صعب وقال: «لن أستطيع». قالت له أمه: «جرّب صفحةً واحدة فقط». قرأ صفحة، ثم أخرى، وفجأة صار الدرس سهلًا وجميلًا. طار {n} فرحًا وهو يقول: «ما كنتُ أعرف أني قوي!» ثم نام مطمئنًا. ابدأ دائمًا بخطوةٍ صغيرة. نومًا هانئًا يا {n}.'],

const A=document.getElementById('m'),PC=document.getElementById('pc');let id=localStorage.getItem('hs_id'),off=0,st,cfg={},sch,L={},TN={};

const now=()=>new Date(Date.now()+off),mins=()=>{const n=now();return n.getHours()*60+n.getMinutes()};
let _ac=null;const muted=()=>localStorage.getItem('hs_mute')==='1';
function acx(){try{if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac}catch(e){return null}}

function sfx(k){if(muted())return;const ac=acx();if(!ac)return;const t0=ac.currentTime,Q={ok:[[660,0],[880,.09],[1320,.18]],no:[[220,0],[165,.12]],up:[[523,0],[659,.12],[784,.24],[1047,.36],[784,.48],[1047,.6],[1319,.72]]};
 (Q[k]||[]).forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=k==='no'?'triangle':'sine';o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.2,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+.22);o.start(t0+d);o.stop(t0+d+.25)})}
function lvUp(all){if(!Object.keys(L).length)return;const r=all>=600?3:all>=500?2:all>=250?1:0,k='hs_rank_'+id,o=localStorage.getItem(k);localStorage.setItem(k,r);if(o!==null&&r>+o){sfx('up');setTimeout(()=>toast('🎉 مبروك! وصلت إلى مستوى جديد: '+['','الفضي 🥈','الذهبي 🥇','الألماسي 💎'][r]),300)}}

function streak(){let n=0,d=now();const P=k=>Object.values(L[k]||{}).reduce((a,x)=>a+(x.p||0),0);if(!P(dayKey(d)))d=new Date(d.getTime()-864e5);for(;P(dayKey(d))>0&&n<400;d=new Date(d.getTime()-864e5))n++;return n}
function lvMsg(a,f){return a>=600?'💎 ما شاء الله يا '+f+'! أنت في المستوى الألماسي':a>=500?'أحسنت يا '+f+'! بقي '+(600-a)+' نقطة للمستوى الألماسي 💎':a>=250?'أحسنت يا '+f+'! بقي '+(500-a)+' نقطة للمستوى الذهبي 🥇':'خطوة بعد خطوة يا '+f+'، بقي '+(250-a)+' نقطة للمستوى الفضي 🥈'}
function draw(){if(!st||!sch)return;const n=now(),di=n.getDay(),dk=dayKey(n);const all=Object.values(L).reduce((a,d)=>a+Object.values(d).reduce((b,x)=>b+(x.p||0),0),0);
 const D=L[dk]||{},T=genD(cfg,sch,di),m=mins();let P=0;const ph=phase(cfg,di,m),cls=all>=600?'win':all>=50?'hot':'';
 const banner=ph.k==='in'?'':'<div class="t" style="justify-content:center"><b>'+ph.text+'</b></div>';
 let rows='',open=false;const close=()=>{if(open){rows+='</div>';open=false}};
 T.forEach(t=>{const d=D[t.id],p=d?d.p||0:0;P+=p;const early=m<t.from,over=m>t.to,late=m>t.to+(t.pin?0:30),note=TN[t.id];
  if(t.hw){if(!open){rows+='<div class="hwc"><div class="hwh">📚 واجبات اليوم<small>لوليّ الأمر: هل أكمل ابنكم الواجبات التالية؟</small></div>';open=true}
   const ctl=d?(d.ok===0?'<span class="bx no">✘</span>':'<span class="bx on">✔</span>'):late?'<span class="bx no">⛔</span>':early?'<span class="hint">يُفتح '+m2t(t.from)+'</span>':'<button class="gb sm" data-y="'+t.id+'">✔ صح</button><button class="ch" data-x="'+t.id+'">✘ لا</button>';
   rows+='<div class="hw"><div class="tt"><b>'+t.title+'</b>'+(over&&!late&&!d?'<small class="miss">⏳ متأخر: نصف النقاط</small>':'')+(d?'<small class="'+(d.ok===0?'miss':'ok')+'">'+(d.ok===0?'لم يكمل':'أكمل · +'+p)+'</small>':late?'<span class="miss">⛔ لم تُسجَّل الإجابة في وقتها</span>':'')+(note?'<span class="nt">📝 '+esc(note)+'</span>':'')+'</div>'+ctl+(!early?'<button class="nb" data-n="'+t.id+'">📝</button>':'')+'</div>';return}
  close();
  const ctl=d?'<span class="bx on">✔</span>':late?'<span class="bx no">⛔</span>':'<button class="gb" data-i="'+t.id+'" '+(early?'disabled':'')+'>'+(early?'لم يحن':({sleep:'نائم',go:'انطلقت',back:'عدت',wake:'استيقظت'})[t.id])+'</button>';
  rows+='<div class="t '+(d?'done':late?'late':early?'off':'')+'">'+ctl+'<div class="tt"><b>'+t.title+'</b><small>'+m2t(t.from)+' – '+m2t(t.to)+(over&&!late&&!d?' · <span class="miss" style="display:inline">⏳ متأخر (نصف النقاط)</span>':'')+(d?' · <span class="ok">+'+p+'</span>':'')+'</small>'+(!d&&late?'<span class="miss">⛔ '+(MISS[t.id]||('فاتك وقت: '+t.title))+'</span>':'')+(note?'<span class="nt">📝 '+esc(note)+'</span>':'')+'</div>'+(t.id==='sleep'?'<button class="nb" data-n="'+t.id+'">📝</button>':'')+'</div>'});close();
 A.innerHTML='<h1 class="nm '+cls+'">'+(all>=600?'🏆 ':'')+'مرحبًا '+st.name+'</h1><div class="sc"><span>نقاط اليوم</span><b>'+P+'</b><span>المجموع</span><b>'+all+'</b></div><div class="pg"><small>'+lvMsg(all,st.name.split(' ')[0])+' · 🔥 '+streak()+' أيام متتالية</small><i><b style="width:'+Math.min(100,all/6)+'%"></b></i></div>'+banner+rows;lvUp(all);try{localStorage.setItem('hs_cache',JSON.stringify({id,st,cfg,sch,L}))}catch(e){}}

 const o=ov('<div class="cl"><div class="av">👨‍🏫</div><h2>الأستاذ علي</h2><p id="cs">جارٍ الاتصال…</p><div id="ct" class="ctx"></div><button class="end" id="ce">📞 إنهاء</button><small class="hint">مكالمة تمثيلية تربوية (لا يوجد اتصال حقيقي)</small></div>');
 const stop=ring();let said=0;const T=setTimeout(()=>{stop();o.querySelector('#cs').textContent='🟢 تم الرد';const t=MSG[kind](n);o.querySelector('#ct').textContent=t;said=1;try{const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}},4500);
 o.querySelector('#ce').onclick=()=>{clearTimeout(T);stop();try{speechSynthesis.cancel()}catch(e){}o.remove()};
 set(ref(db,'home/pn/'+id+'/'+Date.now()),{t:serverTimestamp(),k:'اتصال تربوي',x:lab}).catch(()=>{})}
function pnote(){guard(()=>{const o=ov('<div class="sh"><h3>📝 ملاحظة لأستاذ علي</h3><small>للتلميذ الذي يتعبكم: اكتبوا ما يحدث ليتابعه المعلم.</small><div class="chips">'+['لا ينام مبكرًا','يرفض أداء الواجب','لا يسمع الكلام','كثير الجدال','متقاعس'].map(c=>'<button class="ch">'+c+'</button>').join('')+'</div><textarea id="px" rows="4" placeholder="اكتب الملاحظة..."></textarea><button class="gb" id="ps" style="width:100%">إرسال للأستاذ</button><button class="ch" id="pc2" style="width:100%;margin-top:8px">إلغاء</button></div>');
  o.querySelectorAll('.ch').forEach(b=>{if(b.id!=='pc2')b.onclick=()=>{const x=document.getElementById('px');x.value=(x.value?x.value+'، ':'')+b.textContent}});o.querySelector('#pc2').onclick=()=>o.remove();
  o.querySelector('#ps').onclick=async()=>{const v=document.getElementById('px').value.trim();if(!v)return;await set(ref(db,'home/pn/'+id+'/'+Date.now()),{t:serverTimestamp(),k:'ملاحظة',x:v});o.remove();toast('وصلت ملاحظتكم للأستاذ')}})}
function corner(){PC.innerHTML='<details class="pc"><summary>👨‍👩‍👦 ركن وليّ الأمر</summary><p class="hint">للوالدين: تنبيه تربوي تمثيلي، وملاحظات تصل إلى الأستاذ.</p><button class="ch" data-c="hw">📞 اتصال: لم يؤدِّ واجبه</button><button class="ch" data-c="sleep">📞 اتصال: يتأخر في النوم</button><button class="ch" data-c="beh">📞 اتصال: لا يسمع الكلام</button><button class="ch" id="pn">📝 ملاحظة للأستاذ (متاعب البيت)</button></details><p style="text-align:center"><a id="snd" href="#" class="hint">'+(muted()?'🔇 المؤثرات: متوقفة':'🔊 المؤثرات: تعمل')+'</a> · <a id="out" href="#" class="hint">ليس أنا؟ تغيير الاسم</a></p>'}
document.addEventListener('click',async e=>{const x=e.target;
 if(x.id==='out'){e.preventDefault();localStorage.removeItem('hs_id');location.reload();return}
 if(x.dataset&&x.dataset.c){guard(()=>call(x.dataset.c));return}
 if(x.id==='snd'){e.preventDefault();localStorage.setItem('hs_mute',muted()?'0':'1');x.textContent=muted()?'🔇 المؤثرات: متوقفة':'🔊 المؤثرات: تعمل';sfx('ok');return}
 if(x.id==='pn'){pnote();return}
 if(x.dataset&&x.dataset.n){noteSheet(x.dataset.n);return}
 if(x.id==='go'){const raw=document.getElementById('n').value,ci=cmp(raw);if(ci.length<5)return login('اكتب اسمك الثلاثي كاملًا');
  try{const N=(await get(ref(db,'home/names'))).val()||{},toks=nm(raw).split('_'),hit=new Set();
   for(const k in N){const ck=cmp(k),kt=k.split('_');if(ck===ci||ck.startsWith(ci)||ck.includes(ci)||(toks.length>1&&toks.every(w=>kt.includes(w))))hit.add(N[k])}
   if(!hit.size){const S=(await get(ref(db,'home/students'))).val()||{};for(const k in S){const kn=nm(S[k].name||''),kc=cmp(S[k].name||'');if(kc===ci||kc.startsWith(ci)||kc.includes(ci)||(toks.length>1&&toks.every(w=>kn.split('_').includes(w))))hit.add(k)}}
   if(!hit.size)return login('لم أجد اسمك. تأكد من كتابته كاملًا، أو راجع المعلم.');
   if(hit.size>1)return login('يوجد أكثر من تلميذ بهذا الاسم، اكتب اسمك كاملًا.');
   const r=[...hit][0],s=(await get(ref(db,'home/students/'+r))).val();if(!s)return login('هذا الاسم غير مفعّل، راجع المعلم.');id=r;localStorage.setItem('hs_id',id);start()}catch(e){login('تعذر الاتصال ('+(e.code||e.message||'')+')، حاول مرة أخرى.')}return}
 const y=x.dataset&&(x.dataset.y||x.dataset.x),i=x.dataset&&(x.dataset.i||y);if(!i||!sch)return;
 const di=now().getDay(),t=genD(cfg,sch,di).find(z=>z.id===i);if(!t)return;const p=pts(t,mins());if(p<0)return toast('لم يحن وقتها بعد');if(p===0)return toast('انتهى وقت هذه المهمة');
 const rec=async ok=>{await set(ref(db,'home/log/'+id+'/'+dayKey(now())+'/'+i),{t:serverTimestamp(),p:ok?p:0,ok:ok?1:0,n:t.title});toast(ok?'أحسنتم! تم تسجيل: '+t.title+' (+'+p+')':'سُجّل: لم يكمل '+t.title)};
 if(y){guard(()=>rec(!!x.dataset.y));return}
 if(t.pin&&cfg.pin){const q=prompt('رمز وليّ الأمر:');if(q!==String(cfg.pin)){alert('الرمز غير صحيح');return}}
 x.disabled=true;await rec(true);if(i==='sleep')story()});
function start(){corner();
 onValue(ref(db,'home/students/'+id),v=>{const x=v.val();if(!x&&navigator.onLine){localStorage.removeItem('hs_id');localStorage.removeItem('hs_cache');id=null;st=null;return login()}if(x){st=x;draw()}},()=>{if(!st)login('تعذر الاتصال بقاعدة البيانات')});
 onValue(ref(db,'home/log/'+id),v=>{L=v.val()||{};draw()});onValue(ref(db,'home/tn/'+id+'/'+dayKey(now())),v=>{TN=v.val()||{};draw()});draw()}
onValue(ref(db,'.info/serverTimeOffset'),v=>off=v.val()||0);
onValue(ref(db,'home/config'),v=>{cfg=v.val()||{};draw()});
onValue(ref(db,'home/schedule'),v=>{sch=v.val()||{};draw()});
setInterval(draw,20000);
if(id){try{const c=JSON.parse(localStorage.getItem('hs_cache')||'null');if(c&&c.id===id){st=c.st;cfg=c.cfg||{};sch=c.sch||{};L=c.L||{}}}catch(e){}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
id?start():login();
</script></body></html>
